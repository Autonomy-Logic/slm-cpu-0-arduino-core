name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), e.g. 0.1.0'
        required: true

permissions:
  contents: write

env:
  INDEX: package_FACTS_slm_cpu_0_index.json

jobs:
  release:
    name: Build, publish and update the index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2

      - name: Resolve the version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

      - name: Test the uploader
        working-directory: tools/slm-cpu-0-netflash
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 ./...

      - name: Build every artefact and the index
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          tools/ci/build-uploader.sh dist/tools "$V"
          python3 tools/ci/build-release.py --version "$V" --out dist
          ls -la dist

      # Install from the built artefacts before publishing them, so a broken
      # archive fails the release instead of reaching users.
      - name: Smoke-test the artefacts before publishing
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if tar tjf "dist/FACTS-stm32-slm-cpu-0-$V.tar.bz2" | grep -iE 'backplane|slmmx|slm_mx'; then
            echo "the core archive contains files it must not ship"; exit 1
          fi
          cp "dist/$INDEX" /tmp/index-local.json
          (cd dist && nohup python3 -m http.server 8099 >/dev/null 2>&1 &)
          for i in $(seq 20); do curl -sf http://127.0.0.1:8099/ >/dev/null && break; sleep 0.5; done
          python3 tools/ci/localize-index.py /tmp/index-local.json http://127.0.0.1:8099
          IDX="file:///tmp/index-local.json"
          arduino-cli core update-index --additional-urls "$IDX"
          arduino-cli core install "FACTS:stm32@$V" --additional-urls "$IDX"
          arduino-cli compile --fqbn FACTS:stm32:slm_cpu_0 tools/ci/sketches/slm_cpu_0_smoke
          arduino-cli compile --fqbn FACTS:stm32:slm_cpu_0 tools/ci/sketches/slm_cpu_0_net_api
          TOOL="$(find "$HOME/.arduino15/packages/FACTS/tools/slm-cpu-0-netflash" -name slm-cpu-0-netflash -type f | head -1)"
          "$TOOL" version | grep -qx "slm-cpu-0-netflash $V"
          echo "artefacts install, compile and run"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          gh release view "v$V" >/dev/null 2>&1 \
            && gh release upload "v$V" dist/*.tar.bz2 dist/*.tar.gz --clobber \
            || gh release create "v$V" dist/*.tar.bz2 dist/*.tar.gz \
                 --title "v$V" \
                 --notes "FACTS:stm32 core $V for the SLM-CPU-0, with slm-cpu-0-netflash for 5 hosts."

      # The index is what consumers read, so it is committed only after the
      # assets it points at exist.
      - name: Commit the regenerated index
        run: |
          set -euo pipefail
          cp "dist/$INDEX" "$INDEX"
          if git diff --quiet -- "$INDEX" && git ls-files --error-unmatch "$INDEX" >/dev/null 2>&1; then
            echo "index unchanged"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$INDEX"
          git commit -m "chore(release): point the index at v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: release-artefacts
          path: dist/
